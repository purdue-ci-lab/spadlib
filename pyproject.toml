[project]
name = "spadlib"
version = "0.1.0"
description = "Collection of utilities for reading/writing single-photon data from quanta and asynchronous SPAD sensors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask[array]>=2026.3.0",
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "scipy>=1.17.1",
    "tqdm>=4.68.2",
    "zarr>=3.1.6",
]

[project.optional-dependencies]
cupy12 = ["cupy-cuda12x"]
cupy13 = ["cupy-cuda13x"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
